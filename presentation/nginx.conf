server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header Cache-Control "no-cache";

    location = / {
        return 302 /menu/;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
