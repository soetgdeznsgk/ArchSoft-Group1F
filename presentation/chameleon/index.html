<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bololó · Camaleón</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Pantalla básica del modo camaleón. Reglas: game-logic/docs/MODO_CAMALEON.md -->
    <script src="./chameleon.js" type="module"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1>Camaleón</h1>
        <p class="hint">Reúne los 8 colores sin repetir.</p>
      </div>
      <div class="status">
        <span id="connection" class="connection">● Conectando…</span>
        <span class="help" title="Toca una carta para tomarla">?</span>
        <div class="timer-box">
          <span>TIEMPO</span>
          <strong id="timer">--:--</strong>
          <div class="timer-track"><div id="timer-progress" class="timer-progress"></div></div>
        </div>
      </div>
    </header>

    <main class="layout">
      <section class="board-wrap" aria-label="Mesa">
        <div id="board" class="board" role="group" aria-label="Cartas en la mesa"></div>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </section>
      <section class="players-section" aria-label="Jugadores">
        <h2>JUGADORES</h2>
        <ul id="players" class="players"></ul>
      </section>
    </main>

    <dialog id="final" class="final">
      <h2 id="final-title">Fin de la partida</h2>
      <ol id="final-standings"></ol>
      <a href="/menu/" class="back">Volver al menú</a>
    </dialog>
  </body>
</html>
