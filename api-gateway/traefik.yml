global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":8000"
    asDefault: true
    forwardedHeaders:
      trustedIPs:
        - "10.250.0.2/32"
    transport:
      respondingTimeouts:
        readTimeout: 0
        writeTimeout: 0
        idleTimeout: 180s

providers:
  docker:
    exposedByDefault: false
    network: bololo-integrado_internal

ping: {}

log:
  level: INFO

accessLog:
  format: json
  fields:
    defaultMode: keep
    names:
      RequestPath: drop
    headers:
      defaultMode: drop
