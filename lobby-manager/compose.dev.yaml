# Entorno de desarrollo del Lobby Manager, aislado del docker-compose.yml de la raíz.
# Levanta el servicio con su PostgreSQL y un Game Logic simulado, y publica el puerto 8000.
#
#   docker compose -f lobby-manager/compose.dev.yaml up --build
#   http://localhost:8000/api/docs
#
# Los secretos de este archivo son de juguete: no usarlos fuera de desarrollo.

name: bololo-lobby-dev

services:
  lobby-manager:
    build: .
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: bololo
      POSTGRES_PASSWORD: dev-password
      POSTGRES_DB: bololo
      SESSION_PUBLIC_KEY_FILE: /run/secrets/session_public_key
      GAME_PRIVATE_KEY_FILE: /run/secrets/game_private_key
      SERVICE_SECRET: dev-service-secret-solo-para-desarrollo-0001
      GAME_LOGIC_URL: http://game-logic:8081
      RABBITMQ_URL: amqp://bololo:dev-password@rabbitmq:5672/
      # Permite llamar a la API desde las pantallas servidas en otro puerto.
      CORS_ORIGINS: "*"
    secrets:
      - session_public_key
      - game_private_key
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
      start_interval: 2s

  # Reemplazo temporal de Go: acepta la partida y, a pedido, publica game.ended.
  # Usa la imagen del Lobby porque ya trae aio-pika.
  game-logic:
    build: .
    command: ["python", "/tools/fake_game_logic.py"]
    ports:
      - "18081:8081"
    environment:
      SERVICE_SECRET: dev-service-secret-solo-para-desarrollo-0001
      RABBITMQ_URL: amqp://bololo:dev-password@rabbitmq:5672/
    volumes:
      - ./tools:/tools:ro
    depends_on:
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    entrypoint:
      - /bin/sh
      - -c
      - |
        (
          until rabbitmq-diagnostics -q check_running >/dev/null 2>&1; do sleep 2; done
          rabbitmqctl -q import_definitions /etc/rabbitmq/topology.json \
            || echo "ERROR: no se pudo declarar la topología de rabbitmq/topology.json" >&2
        ) &
        exec docker-entrypoint.sh rabbitmq-server
    environment:
      RABBITMQ_DEFAULT_USER: bololo
      RABBITMQ_DEFAULT_PASS: dev-password
    volumes:
      - ../rabbitmq/topology.json:/etc/rabbitmq/topology.json:ro
    healthcheck:
      test: ["CMD-SHELL", "rabbitmqctl -q list_queues name > /tmp/queues && grep -qx lobby.game-ended /tmp/queues && grep -qx ratings.game-finished /tmp/queues"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  postgres:
    image: postgres:16.15-alpine
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_USER: bololo
      POSTGRES_PASSWORD: dev-password
      POSTGRES_DB: bololo
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bololo -d bololo"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
      start_interval: 2s

secrets:
  session_public_key:
    file: ../secrets/jwt/session-public.pem
  game_private_key:
    file: ../secrets/jwt/game-private.pem
