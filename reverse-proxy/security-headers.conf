# Cabeceras seguras de todas las respuestas del 443 (escenario 2). Se incluye en el server
# y en cada location que agrega cabeceras propias, porque add_header no se hereda en ese caso.
# HSTS_MAX_AGE no se puede usar aquí (envsubst solo procesa templates/): por eso el valor
# llega en $hsts_max_age, definido en la plantilla.
add_header Strict-Transport-Security "max-age=$hsts_max_age" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
