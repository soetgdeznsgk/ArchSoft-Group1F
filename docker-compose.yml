# Bololo - despliegue completo (Prototipo 1)
# Esqueleto: lobby-manager y game-logic usan
# traefik/whoami como relleno.

name: bololo

services:
  # Gateway: unico con puertos publicados
  traefik:
    image: traefik:v3.7.14
    ports:
      - "80:80"
    volumes:
      # Traefik lee los labels via el socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - public
      - internal

  # Presentacion: estaticos p5.js
  frontend:
    image: nginx:1.30.5-alpine
    volumes:
      # provisional: en el paso 3 sera Dockerfile
      - ./presentation:/usr/share/nginx/html:ro
    networks:
      - internal

  # Logica: salas (Python/FastAPI) - RELLENO
  lobby-manager:
    image: traefik/whoami:v1.12.0
    command: ["--port", "8000"]
    networks:
      - internal

  # Logica: partida (Go) - RELLENO
  game-logic:
    image: traefik/whoami:v1.12.0
    command: ["--port", "8080"]
    networks:
      - internal

  # Datos: relacional
  postgres:
    image: postgres:16.15-alpine
    environment:
      # provisional: en el paso 5 pasa a .env
      POSTGRES_USER: bololo
      POSTGRES_PASSWORD: bololo
      POSTGRES_DB: bololo
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - internal

  # Datos: NoSQL
  redis:
    image: redis:7.4.11-alpine
    volumes:
      - redis-data:/data
    networks:
      - internal

networks:
  public:
  # internal: sin salida a internet ni puertos
  internal:
    internal: true

volumes:
  pg-data:
  redis-data:
