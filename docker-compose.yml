name: bololo-integrado

services:
  reverse-proxy:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    environment:
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-300}
      NGINX_ENVSUBST_FILTER: ^HSTS_MAX_AGE
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./reverse-proxy/proxy-headers.conf:/etc/nginx/snippets/proxy-headers.conf:ro
      - ./reverse-proxy/templates:/etc/nginx/templates:ro
      - ./api-gateway/certs:/certs:ro
    tmpfs:
      - /etc/nginx/conf.d
      - /var/cache/nginx
      - /run
      - /tmp
    networks:
      edge:
        ipv4_address: 10.250.0.2
      public:
    depends_on:
      traefik:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 2s

  traefik:
    image: traefik:v3.7.14
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./api-gateway/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      edge:
        ipv4_address: 10.250.0.3
      services:
        ipv4_address: 10.251.0.2
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 2s

  frontend:
    build:
      context: .
      dockerfile: presentation-ssr/Dockerfile
    restart: unless-stopped
    environment:
      RATINGS_URL: http://ratings-service:8000
    networks:
      - services
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.routers.web.priority=1"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 2s

  auth:
    build: ./auth-service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-postgres:5432/${AUTH_POSTGRES_DB:-bololo_auth}
      SPRING_DATASOURCE_USERNAME: ${AUTH_POSTGRES_USER:-bololo_auth}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}}
      SESSION_PRIVATE_KEY_FILE: /run/secrets/session_private_key
      SESSION_PUBLIC_KEY_FILE: /run/secrets/session_public_key
    secrets:
      - session_private_key
      - session_public_key
    networks:
      - services
      - auth-data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/auth/`)"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.routers.auth.priority=10"
      - "traefik.http.services.auth.loadbalancer.server.port=8080"
    depends_on:
      auth-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q --spider http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  lobby-manager:
    build: ./lobby-manager
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      SESSION_PUBLIC_KEY_FILE: /run/secrets/session_public_key
      GAME_PRIVATE_KEY_FILE: /run/secrets/game_private_key
      SERVICE_SECRET: ${SERVICE_SECRET:?Falta SERVICE_SECRET en .env}
      GAME_LOGIC_URL: http://game-logic:8081
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Falta RABBITMQ_USER en .env}:${RABBITMQ_PASSWORD:?Falta RABBITMQ_PASSWORD en .env}@rabbitmq:5672/
      # Uvicorn acepta X-Forwarded-Proto de Traefik (que lo reescribe en cada petición
      # externa). Sin esto cree que la petición llegó por http y redirige a http://.
      FORWARDED_ALLOW_IPS: 10.251.0.2
    secrets:
      - session_public_key
      - game_private_key
    networks:
      - services
      - lobby-data
      - messaging
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lobby.rule=PathPrefix(`/api/`)"
      - "traefik.http.routers.lobby.entrypoints=web"
      - "traefik.http.services.lobby.loadbalancer.server.port=8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
      start_interval: 2s

  auth-postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTH_POSTGRES_USER:-bololo_auth}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}}
      POSTGRES_DB: ${AUTH_POSTGRES_DB:-bololo_auth}
    volumes:
      - auth-pg-data:/var/lib/postgresql/data
    networks:
      - auth-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  game-logic:
    build:
      context: ./game-logic
      args:
        APP: server
    restart: unless-stopped
    environment:
      GAME_LOGIC_ADDR: ":8081"
      REDIS_URL: redis://:${REDIS_PASSWORD:?Falta REDIS_PASSWORD en .env}@redis:6379/0
      GAME_PUBLIC_KEY_FILE: /run/secrets/game_public_key
      SERVICE_SECRET: ${SERVICE_SECRET:?Falta SERVICE_SECRET en .env}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Falta RABBITMQ_USER en .env}:${RABBITMQ_PASSWORD:?Falta RABBITMQ_PASSWORD en .env}@rabbitmq:5672/
      # Origin aceptado en el upgrade del WebSocket. Solo https: una página servida
      # en claro no puede abrir la partida. Para la LAN: https://localhost,https://<IP>
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://localhost}
    secrets:
      - game_public_key
    networks:
      - services
      - game-data
      - messaging
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.game-ws.rule=PathPrefix(`/ws/games/`)"
      - "traefik.http.routers.game-ws.entrypoints=web"
      - "traefik.http.services.game-ws.loadbalancer.server.port=8081"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 2s

  bot-service:
    build: ./bot-service
    restart: unless-stopped
    environment:
      LOBBY_URL: http://lobby-manager:8000
      AUTH_URL: http://auth:8080
      GAME_LOGIC_URL: http://game-logic:8081
      BOT_THINK_MIN_MS: ${BOT_THINK_MIN_MS:-900}
      BOT_THINK_MAX_MS: ${BOT_THINK_MAX_MS:-2200}
      BOT_REACT_MIN_MS: ${BOT_REACT_MIN_MS:-400}
      BOT_REACT_MAX_MS: ${BOT_REACT_MAX_MS:-1200}
    networks:
      - services
    labels:
      - "traefik.enable=true"
      # Más específica que /api/ (lobby-manager): la prioridad la hace ganar.
      - "traefik.http.routers.bots.rule=PathPrefix(`/api/bots/`)"
      - "traefik.http.routers.bots.entrypoints=web"
      - "traefik.http.routers.bots.priority=30"
      - "traefik.http.services.bots.loadbalancer.server.port=8090"
    depends_on:
      auth:
        condition: service_healthy
      lobby-manager:
        condition: service_healthy
      game-logic:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 2s

  ratings-service:
    build: ./ratings-service
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ratings-postgres
      POSTGRES_USER: ${RATINGS_POSTGRES_USER:?Falta RATINGS_POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${RATINGS_POSTGRES_PASSWORD:?Falta RATINGS_POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${RATINGS_POSTGRES_DB:?Falta RATINGS_POSTGRES_DB en .env}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?Falta RABBITMQ_USER en .env}:${RABBITMQ_PASSWORD:?Falta RABBITMQ_PASSWORD en .env}@rabbitmq:5672/
      # Igual que lobby-manager: las redirecciones salen con https:// detrás de Traefik.
      FORWARDED_ALLOW_IPS: 10.251.0.2
    networks:
      - services
      - ratings-data
      - messaging
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ratings.rule=PathPrefix(`/api/ratings/`)"
      - "traefik.http.routers.ratings.entrypoints=web"
      - "traefik.http.routers.ratings.priority=30"
      - "traefik.http.services.ratings.loadbalancer.server.port=8000"
    depends_on:
      ratings-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
      start_interval: 2s

  ratings-postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${RATINGS_POSTGRES_USER:?Falta RATINGS_POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${RATINGS_POSTGRES_PASSWORD:?Falta RATINGS_POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${RATINGS_POSTGRES_DB:?Falta RATINGS_POSTGRES_DB en .env}
    volumes:
      - ratings-pg-data:/var/lib/postgresql/data
    networks:
      - ratings-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
      start_interval: 2s

  rabbitmq:
    image: rabbitmq:3.13.7-management-alpine
    hostname: rabbitmq
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
      - |
        (
          until rabbitmq-diagnostics -q check_running >/dev/null 2>&1; do sleep 2; done
          rabbitmqctl -q import_definitions /etc/rabbitmq/topology.json \
            || echo "ERROR: no se pudo declarar la topología de rabbitmq/topology.json" >&2
        ) &
        exec docker-entrypoint.sh rabbitmq-server
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Falta RABBITMQ_USER en .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Falta RABBITMQ_PASSWORD en .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/topology.json:/etc/rabbitmq/topology.json:ro
    networks:
      - messaging
    healthcheck:
      test: ["CMD-SHELL", "rabbitmqctl -q list_queues name > /tmp/queues && grep -qx lobby.game-ended /tmp/queues && grep -qx ratings.game-finished /tmp/queues"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 60s
      start_interval: 2s

  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - lobby-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
      start_interval: 2s

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?Falta REDIS_PASSWORD en .env}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - game-data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 2s

networks:
  public:
  edge:
    internal: true
    ipam:
      config:
        - subnet: 10.250.0.0/28
  services:
    internal: true
    ipam:
      config:
        - subnet: 10.251.0.0/24
          ip_range: 10.251.0.128/25
  auth-data:
    internal: true
  lobby-data:
    internal: true
  ratings-data:
    internal: true
  game-data:
    internal: true
  messaging:
    internal: true

secrets:
  session_private_key:
    file: ./secrets/jwt/session-private.pem
  session_public_key:
    file: ./secrets/jwt/session-public.pem
  game_private_key:
    file: ./secrets/jwt/game-private.pem
  game_public_key:
    file: ./secrets/jwt/game-public.pem

volumes:
  pg-data:
  auth-pg-data:
  ratings-pg-data:
  rabbitmq-data:
  redis-data:
