# Bololo - despliegue completo 
# Esqueleto: 

name: bololo

services:
  # Gateway: unico con puertos publicados
  traefik:
    image: traefik:v3.7.14
    ports:
      - "80:80"
    volumes:
      # Traefik lee los labels via el socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./api-gateway/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - public
      - internal

  # Presentacion: estaticos p5.js
  frontend:
    build: ./presentation
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.web.entrypoints=web"
      - "traefik.http.routers.web.priority=1"
      - "traefik.http.services.web.loadbalancer.server.port=80"

  # Logica: salas (Python/FastAPI) 
  lobby-manager:
    image: traefik/whoami:v1.12.0
    command: ["--port", "8000"]
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lobby.rule=PathPrefix(`/api/`)"
      - "traefik.http.routers.lobby.entrypoints=web"
      - "traefik.http.services.lobby.loadbalancer.server.port=8000"

  # Logica: partida (Go) 
  game-logic:
    image: traefik/whoami:v1.12.0
    command: ["--port", "8080"]
    networks:
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.game-ws.rule=PathPrefix(`/ws/games/`)"
      - "traefik.http.routers.game-ws.entrypoints=web"
      - "traefik.http.services.game-ws.loadbalancer.server.port=8080"

  # Datos: relacional
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - internal

  # Datos: NoSQL
  redis:
    image: redis:7.4.11-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?Falta REDIS_PASSWORD en .env}
    volumes:
      - redis-data:/data
    networks:
      - internal


networks:
  public:
  internal:
    internal: true

volumes:
  pg-data:
  redis-data:
