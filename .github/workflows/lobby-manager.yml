name: lobby-manager

on:
  push:
    paths: ["lobby-manager/**", ".github/workflows/lobby-manager.yml"]
  pull_request:
    paths: ["lobby-manager/**", ".github/workflows/lobby-manager.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lobby-manager
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lobby_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d lobby_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/lobby_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lobby-manager/requirements-dev.txt
      - name: dependencias
        run: pip install -r requirements-dev.txt
      - name: pruebas
        run: pytest -q
      - name: imagen
        run: docker build -t bololo/lobby-manager .
