name: auth-service

on:
  push:
    paths: ["auth-service/**", "lobby-manager/app/**", ".github/workflows/auth-service.yml"]
  pull_request:
    paths: ["auth-service/**", "lobby-manager/app/**", ".github/workflows/auth-service.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: auth-service/pom.xml
      - name: tests
        run: mvn --batch-mode test
      - name: container image
        run: docker build -t bololo/auth-service .
